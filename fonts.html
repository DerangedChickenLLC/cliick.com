  <style>
    body {
      background-color: #f9f9f9;
      color: #222;
      font-family: "Comic Sans MS", cursive, sans-serif;
      margin: 40px;
    }

    .font-block {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 30px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .font-name {
      font-size: 14px;
      color: #888;
      margin-bottom: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    h1 {
      font-size: 36px;
      margin: 0 0 10px;
    }

    h2 {
      font-size: 20px;
      font-weight: normal;
      margin: 0 0 8px;
    }

    p {
      font-size: 16px;
      margin: 0;
    }

    hr {
      border: none;
      border-top: 1px solid #ddd;
      margin: 40px 0;
    }
  </style>
</head>
<body>
  <h1 style="text-align:center;">Cliick Font Preview</h1>
  <p style="text-align:center; color:#666;">Comparing 30 Google Fonts (fallback: Comic Sans)</p>
  <hr>

  <script>
    // const fonts = [
    //   "Roboto","Open Sans","Lato","Montserrat","Poppins","Raleway","Nunito",
    //   "Merriweather","Playfair Display","Oswald","Source Sans Pro","Work Sans",
    //   "Quicksand","Rubik","DM Sans","Karla","Inter","IBM Plex Sans","Space Grotesk",
    //   "Cabin","Fira Sans","Heebo","Urbanist","Manrope","Josefin Sans","Exo 2",
    //   "PT Sans","Ubuntu","Teko","DM Serif Display"
    // ];

    const fonts = ["Lato", "Montserrat","Urbanist", "Josefin Sans"];

    document.addEventListener("DOMContentLoaded", () => {
      const body = document.body;
      fonts.forEach(font => {
        const block = document.createElement("div");
        block.className = "font-block";
        block.style.fontFamily = `'${font}', "Comic Sans MS", cursive, sans-serif`;
        block.innerHTML = `
          <div class="font-name">${font}</div>
          <h1>Cliick vs Dick</h1>
          <h2>Your private network</h2>
          <p>Welcome to Cliick!</p>
        `;
        body.appendChild(block);
      });
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Read Cliick’s Terms of Service."/>
  <title>Cliick | Terms of Service</title>
    <meta property="og:type" content="website"/>
    <meta property="og:site_name" content="Cliick"/>
    <meta property="og:title" content="Cliick | Terms of Service"/>
    <meta property="og:description" content="Read Cliick’s Terms of Service."/>
    <meta property="og:url" content="https://cliick.com/terms/"/>
    <meta property="og:image" content="https://cliick.com/images/cliick-icon.png"/>

    <meta name="twitter:card" content="summary"/>
    <meta name="twitter:title" content="Cliick | Terms of Service"/>
    <meta name="twitter:description" content="Read Cliick’s Terms of Service."/>
    <meta name="twitter:image" content="https://cliick.com/images/cliick-icon.png"/>

    <link rel="apple-touch-icon" href="https://cliick.com/images/cliick-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,600;1,100;1,200;1,300&display=swap" rel="stylesheet">
  <style>
    /* Policy Hero (Support-style) */
    .policy-hero {
      background: #000000;
      padding: 4.5rem 1.5rem 3.5rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .policy-hero-inner {
      max-width: 860px;
      margin: 0 auto;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.1rem;
    }

    .policy-hero h1 {
      font-size: var(--fs-hero-title-lg);
      font-weight: var(--fw-hero-title);
      letter-spacing: -1px;
    }

    .policy-hero .tagline {
      font-size: var(--fs-hero-tagline);
      max-width: 650px;
      line-height: 1.5;
      opacity: 0.85;
    }

    /* Terms of Service Imported Content */
    .tos-content {
      max-width: 900px;
      margin: 0 auto 2rem auto;
      padding: 3rem 1.5rem 3rem;
      line-height: 1.55;
      color: #000000;
      font-size: var(--fs-body-sm);
      font-family: var(--font-sans);
    }

    .tos-content .title, .tos-content h1 {
      font-size: var(--fs-policy-h1);
      font-family: var(--font-sans);
      margin-bottom: 1rem;
      font-weight: var(--fw-light);
      color: #000000;
      text-align: left;
    }

    .tos-content h2 {
      margin-top: 2.5rem;
      margin-bottom: 0.75rem;
      font-size: var(--fs-policy-h2);
      line-height: 1.2;
      color: #000000;
      position: relative;
      font-weight: var(--fw-light);
      text-align: left;
    }

    .tos-content h3 {
      margin-top: 1.5rem;
      margin-bottom: 0.5rem;
      font-size: var(--fs-policy-h3);
      color: #000000;
      font-weight: var(--fw-regular);
    }

    .tos-content p { 
      margin-bottom: 1rem;
      font-weight: var(--fw-light);
      font-size: var(--fs-body);
    }

    .tos-content ul { 
      margin: 0 0 1.2rem 1.25rem;
      padding: 0;
    }

    .tos-content li { 
      margin-bottom: 0.5rem;
      font-weight: var(--fw-light);
    }

    .tos-content strong {
      font-weight: var(--fw-regular);
    }

    .tos-content .loading { 
      text-align: center;
      padding: 4rem 0;
      color: #9ca3af;
    }

    .tos-content .error { 
      color: #f87171;
      font-weight: var(--fw-semibold);
    }

    @media (max-width: 768px) {
      .tos-content { font-size: var(--fs-body-sm); }
      .tos-content h1 { font-size: var(--fs-policy-h1-mobile); }
      .tos-content h2 { font-size: var(--fs-policy-h2-mobile); }
      .tos-content h3 { font-size: var(--fs-policy-h3-mobile); }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="nav-logo">
        <img src="../images/cliick-icon.png" alt="Cliick Logo" class="logo-img">
      </a>
      <div class="nav-menu">
        <a href="../privacy/" class="nav-link">Privacy Policy</a>
        <a href="../terms/" class="nav-link">Terms of Service</a>
        <a href="../support/" class="nav-link">Support</a>
      </div>
      <div class="nav-toggle">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </div>
    </div>
  </nav>

  <header class="policy-hero" aria-label="Terms of Service">
    <div class="policy-hero-inner">
      <h1>Terms of Service</h1>
      <p class="tagline">The terms that govern use of Cliick.</p>
    </div>
  </header>

  <main>
    <section id="terms-of-service" class="tos-content" data-src="tos.html">
      <div class="loading">Loading terms of service...</div>
      <noscript>Please enable JavaScript to view the full Terms of Service.</noscript>
    </section>
  </main>

  <!-- FOOTER_START -->
<footer class="footer">
  <div class="footer-container">
    <div class="footer-menu">
      <a href="../privacy/" class="footer-link">Privacy Policy</a>
      <a href="../terms/" class="footer-link">Terms of Service</a>
      <a href="../deleteme/" class="footer-link">Account Deletion</a>
      <a href="../support/" class="footer-link">Support</a>
    </div>
    <div class="footer-info">
      <p>&copy; Deranged Chicken LLC. All rights reserved.</p>
    </div>
  </div>
</footer>
<!-- FOOTER_END -->



  <script>
    // Dynamically load Terms of Service content
    (function() {
      const container = document.getElementById('terms-of-service');
      if (!container) return;
      const src = container.getAttribute('data-src') || 'tos.html';
      fetch(src, { cache: 'no-store' })
        .then(resp => {
          if (!resp.ok) throw new Error('Failed to load terms of service');
          return resp.text();
        })
        .then(html => {
          const parser = new DOMParser();
          const doc = parser.parseFromString(html, 'text/html');
          let bodyContent = doc.body ? doc.body.innerHTML : html;
          container.innerHTML = '<div class="tos-inner">' + bodyContent + '</div>';
        })
        .catch(err => {
          console.error(err);
          container.innerHTML = '<p class="error">Unable to load the Terms of Service at this time. Please try again later.</p>';
        });
    })();

      // Mobile menu toggle functionality
      const navToggle = document.querySelector('.nav-toggle');
      const navMenu = document.querySelector('.nav-menu');

      navToggle.addEventListener('click', () => {
        navMenu.classList.toggle('active');
        navToggle.classList.toggle('active');
      });

      // Close mobile menu when clicking on a link
      const navLinks = document.querySelectorAll('.nav-link');
      navLinks.forEach(link => {
        link.addEventListener('click', () => {
          navMenu.classList.remove('active');
          navToggle.classList.remove('active');
        });
      });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Terms of Service | Cliick"/>
  <title>Cliick | Terms of Service</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    /* Privacy Policy Imported Content */
    .tos-content {
      max-width: 900px;
      margin: 4rem auto 2rem auto;
      padding: 0 1.5rem 3rem;
      line-height: 1.55;
      color: #000000;
      font-size: 0.95rem;
    }

    .tos-content .title, .tos-content h1 {
      font-size: 2.2rem;
      margin-bottom: 1rem;
      font-weight: 600;
      color: #000000;
      text-align: center;
    }

    .tos-content h2 {
      margin-top: 2.5rem;
      margin-bottom: 0.75rem;
      font-size: 1.4rem;
      line-height: 1.2;
      color: #000000;
      position: relative;
    }

    .tos-content p { margin-bottom: 1rem; }
    .tos-content ul { margin: 0 0 1.2rem 1.25rem; padding: 0; }
    .tos-content li { margin-bottom: 0.5rem; }

    .tos-content .loading { text-align: center; padding: 4rem 0; color: #9ca3af; }
    .tos-content .error { color: #f87171; font-weight: 600; }

    @media (max-width: 768px) {
      .tos-content { margin-top: 5rem; font-size: 0.95rem; }
      .tos-content h1 { font-size: 1.9rem; }
      .tos-content h2 { font-size: 1.25rem; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="../index.html" class="nav-logo">
        <img src="../images/cliick-logo.png" alt="Cliick Logo" class="logo-img">
      </a>
      <div class="nav-menu">
        <a href="../terms/index.html" class="nav-link">Terms of Service</a>
        <a href="../privacy/index.html" class="nav-link">Privacy Policy</a>
        <a href="../support/index.html" class="nav-link">Support</a>
      </div>
      <div class="nav-toggle">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </div>
    </div>
  </nav>

  <main>
    <section id="terms-of-service" class="tos-content" data-src="tos.html">
      <div class="loading">Loading terms of service...</div>
      <noscript>Please enable JavaScript to view the full Terms of Service.</noscript>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-container">
      <div class="footer-menu">
        <a href="../terms/index.html" class="footer-link">Terms of Service</a>
        <a href="../privacy/index.html" class="footer-link">Privacy Policy</a>
        <a href="../support/index.html" class="footer-link">Support</a>
      </div>
      <div class="footer-info">
        <p>&copy; 2025 Cliick. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script>
    // Dynamically load Terms of Service content
    (function() {
      const container = document.getElementById('terms-of-service');
      if (!container) return;
      const src = container.getAttribute('data-src') || 'tos.html';
      fetch(src, { cache: 'no-store' })
        .then(resp => {
          if (!resp.ok) throw new Error('Failed to load terms of service');
          return resp.text();
        })
        .then(html => {
          const parser = new DOMParser();
          const doc = parser.parseFromString(html, 'text/html');
          let bodyContent = doc.body ? doc.body.innerHTML : html;
          container.innerHTML = '<div class="tos-inner">' + bodyContent + '</div>';
        })
        .catch(err => {
          console.error(err);
          container.innerHTML = '<p class="error">Unable to load the Terms of Service at this time. Please try again later.</p>';
        });
    })();

      // Mobile menu toggle functionality
      const navToggle = document.querySelector('.nav-toggle');
      const navMenu = document.querySelector('.nav-menu');

      navToggle.addEventListener('click', () => {
        navMenu.classList.toggle('active');
        navToggle.classList.toggle('active');
      });

      // Close mobile menu when clicking on a link
      const navLinks = document.querySelectorAll('.nav-link');
      navLinks.forEach(link => {
        link.addEventListener('click', () => {
          navMenu.classList.remove('active');
          navToggle.classList.remove('active');
        });
      });
  </script>
</body>
</html>

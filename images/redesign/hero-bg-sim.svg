<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="">
  <title>Placeholder hero backdrop — simulated city dusk bokeh</title>
  <defs>
    <!-- Ground: city dusk. Cool shadow lower-left, warm key upper-right. -->
    <linearGradient id="dusk" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0"    stop-color="#101827"/>
      <stop offset="0.26" stop-color="#22283d"/>
      <stop offset="0.50" stop-color="#4a3f4d"/>
      <stop offset="0.72" stop-color="#8a5f4a"/>
      <stop offset="0.89" stop-color="#c2884f"/>
      <stop offset="1"    stop-color="#e8bd82"/>
    </linearGradient>

    <!-- Warm bokeh orb -->
    <radialGradient id="warm">
      <stop offset="0"    stop-color="#ffd9a0" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#ffb765" stop-opacity="0.34"/>
      <stop offset="1"    stop-color="#ff9d45" stop-opacity="0"/>
    </radialGradient>
    <!-- Cool bokeh orb, for depth separation -->
    <radialGradient id="cool">
      <stop offset="0"    stop-color="#9fd4ff" stop-opacity="0.42"/>
      <stop offset="0.5"  stop-color="#5f9fd6" stop-opacity="0.16"/>
      <stop offset="1"    stop-color="#3f7ab0" stop-opacity="0"/>
    </radialGradient>
    <!-- Foreground mass: gradient-filled so it falls off to true transparency.
         Blurred solid shapes leave a visible contour and a purple fringe where
         dark sits over the warm key; a gradient cannot. -->
    <radialGradient id="mass">
      <stop offset="0"    stop-color="#171018" stop-opacity="0.66"/>
      <stop offset="0.5"  stop-color="#171018" stop-opacity="0.36"/>
      <stop offset="1"    stop-color="#171018" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft key light spilling from upper right -->
    <radialGradient id="key" cx="0.78" cy="0.16" r="0.72">
      <stop offset="0"   stop-color="#ffe0b0" stop-opacity="0.52"/>
      <stop offset="0.55" stop-color="#ffc07a" stop-opacity="0.14"/>
      <stop offset="1"   stop-color="#ffab5e" stop-opacity="0"/>
    </radialGradient>
    <!-- Vignette to seat the subject and keep headline contrast on the left -->
    <radialGradient id="vig" cx="0.56" cy="0.46" r="0.78">
      <stop offset="0.45" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1"    stop-color="#000814" stop-opacity="0.55"/>
    </radialGradient>
    <!-- Depth-of-field: everything behind the subject is thrown well out of focus -->
    <filter id="farBlur"  x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <!-- The subject reads as a soft mass, not a person we could critique -->
    <filter id="nearBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#dusk)"/>

  <!-- Far plane: out-of-focus city lights -->
  <g filter="url(#farBlur)">
    <circle cx="1245" cy="168" r="132" fill="url(#warm)"/>
    <circle cx="1425" cy="330" r="104" fill="url(#warm)"/>
    <circle cx="1095" cy="392" r="76"  fill="url(#warm)"/>
    <circle cx="1500" cy="120" r="88"  fill="url(#warm)"/>
    <circle cx="905"  cy="150" r="94"  fill="url(#warm)"/>
    <circle cx="1330" cy="545" r="66"  fill="url(#warm)"/>
    <circle cx="700"  cy="262" r="70"  fill="url(#warm)"/>
    <circle cx="1055" cy="640" r="58"  fill="url(#warm)"/>
    <circle cx="252"  cy="205" r="120" fill="url(#cool)"/>
    <circle cx="470"  cy="440" r="92"  fill="url(#cool)"/>
    <circle cx="120"  cy="600" r="140" fill="url(#cool)"/>
    <circle cx="628"  cy="742" r="86"  fill="url(#cool)"/>
    <circle cx="368"  cy="862" r="102" fill="url(#cool)"/>
    <!-- Street-level light smear, suggests a road receding -->
    <ellipse cx="1180" cy="880" rx="430" ry="86" fill="#ffb765" opacity="0.20"/>
    <ellipse cx="330"  cy="930" rx="330" ry="64" fill="#7fb4e0" opacity="0.13"/>
  </g>

  <rect width="1600" height="1000" fill="url(#key)"/>

  <!-- Mid plane: an out-of-focus foreground presence, right of centre. It gives
       the composition the same weight and light-blocking a real subject will,
       without drawing anatomy we would only end up arguing about. When the real
       photograph lands, this whole file is replaced. -->
  <ellipse cx="1135" cy="742" rx="352" ry="462" fill="url(#mass)"/>
  <ellipse cx="975"  cy="968" rx="430" ry="322" fill="url(#mass)"/>
  <!-- Key light wrapping past it on the right, and a cool spill low and left -->
  <ellipse cx="1372" cy="606" rx="232" ry="316" fill="url(#warm)" opacity="0.44"/>
  <ellipse cx="861"  cy="742" rx="150" ry="232" fill="url(#cool)" opacity="0.30"/>

  <rect width="1600" height="1000" fill="url(#vig)"/>
  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.5"/>
</svg>

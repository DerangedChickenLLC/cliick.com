<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Privacy Policy | Cliick"/>
  <title>Cliick | Privacy Policy</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,600;1,100;1,200;1,300&display=swap" rel="stylesheet">

  <style>
    /* Policy Hero (Support-style) */
    .policy-hero {
      background: #000000;
      padding: 4.5rem 1.5rem 3.5rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .policy-hero-inner {
      max-width: 860px;
      margin: 0 auto;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.1rem;
    }

    .policy-hero h1 {
      font-size: clamp(2.4rem, 6vw, 3.8rem);
      font-weight: 400;
      letter-spacing: -1px;
    }

    .policy-hero .tagline {
      font-size: 1.05rem;
      max-width: 650px;
      line-height: 1.5;
      opacity: 0.85;
    }

    /* Privacy Policy Imported Content */
    .privacy-content {
      max-width: 900px;
      margin: 0 auto 2rem auto;
      padding: 3rem 1.5rem 3rem;
      line-height: 1.55;
      color: #000000;
      font-size: 0.95rem;
      font-family: 'Poppins', sans-serif;
    }

    .privacy-content .title, .privacy-content h1 {
      font-size: 2.2rem;
      font-family: 'Poppins', sans-serif;
      margin-bottom: 1rem;
      font-weight: 300;
      color: #000000;
      text-align: left;
    }

    .privacy-content h2 {
      margin-top: 2.5rem;
      margin-bottom: 0.75rem;
      font-size: 1.4rem;
      line-height: 1.2;
      color: #000000;
      position: relative;
      font-weight: 300;
      text-align: left;
    }

    .privacy-content h3 {
      margin-top: 1.5rem;
      margin-bottom: 0.5rem;
      font-size: 1.2rem;
      color: #000000;
      font-weight: 400;
    }

    .privacy-content p { 
      margin-bottom: 1rem;
      font-weight: 300;
      font-size: 1rem;
    }

    .privacy-content ul { 
      margin: 0 0 1.2rem 1.25rem;
      padding: 0;
    }

    .privacy-content li { 
      margin-bottom: 0.5rem;
      font-weight: 300;
    }

    .privacy-content strong {
      font-weight: 400;
    }

    .privacy-content .loading { 
      text-align: center;
      padding: 4rem 0;
      color: #9ca3af;
    }

    .privacy-content .error { 
      color: #f87171;
      font-weight: 600;
    }

    @media (max-width: 768px) {
      .privacy-content { font-size: 0.95rem; }
      .privacy-content h1 { font-size: 1.9rem; }
      .privacy-content h2 { font-size: 1.25rem; }
      .privacy-content h3 { font-size: 1.1rem; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="nav-logo">
        <img src="../images/cliick-icon.png" alt="Cliick Logo" class="logo-img">
      </a>
      <div class="nav-menu">
        <a href="../privacy/" class="nav-link">Privacy Policy</a>
        <a href="../terms/" class="nav-link">Terms of Service</a>
        <a href="../support/" class="nav-link">Support</a>
      </div>
      <div class="nav-toggle">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </div>
    </div>
  </nav>

  <header class="policy-hero" aria-label="Privacy Policy">
    <div class="policy-hero-inner">
      <h1>Privacy Policy</h1>
      <p class="tagline">How Cliick handles your data.</p>
    </div>
  </header>

  <main>
    <section id="privacy-policy" class="privacy-content" data-src="privacy.html">
      <div class="loading">Loading privacy policy...</div>
      <noscript>Please enable JavaScript to view the full Privacy Policy.</noscript>
    </section>
  </main>

  <!-- FOOTER_START -->
<footer class="footer">
  <div class="footer-container">
    <div class="footer-menu">
      <a href="../privacy/" class="footer-link">Privacy Policy</a>
      <a href="../terms/" class="footer-link">Terms of Service</a>
      <a href="../deleteme/" class="footer-link">Account Deletion</a>
      <a href="../support/" class="footer-link">Support</a>
    </div>
    <div class="footer-info">
      <p>&copy; Deranged Chicken LLC. All rights reserved.</p>
    </div>
  </div>
</footer>
<!-- FOOTER_END -->



  <script>
      // Dynamically load privacy.html content
      (function() {
        const container = document.getElementById('privacy-policy');
        if (!container) return;
        const src = container.getAttribute('data-src');
        fetch(src, { cache: 'no-store' })
          .then(resp => {
            if (!resp.ok) throw new Error('Failed to load privacy policy');
            return resp.text();
          })
          .then(html => {
            // Parse and extract <body> inner content if present
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            let bodyContent = doc.body ? doc.body.innerHTML : html;
            // Remove duplicate doctype/head remnants if any
            container.innerHTML = '<div class="policy-inner">' + bodyContent + '</div>';
          })
          .catch(err => {
            console.error(err);
            container.innerHTML = '<p class="error">Unable to load privacy policy at this time. Please try again later.</p>';
          });
      })();

      // Mobile menu toggle functionality
      const navToggle = document.querySelector('.nav-toggle');
      const navMenu = document.querySelector('.nav-menu');

      navToggle.addEventListener('click', () => {
        navMenu.classList.toggle('active');
        navToggle.classList.toggle('active');
      });

      // Close mobile menu when clicking on a link
      const navLinks = document.querySelectorAll('.nav-link');
      navLinks.forEach(link => {
        link.addEventListener('click', () => {
          navMenu.classList.remove('active');
          navToggle.classList.remove('active');
        });
      });
  </script>
</body>
</html>
